name: CI

# 自动 CI 检查：针对 master 的 PR 自动触发，编译校验三部分代码，
# 任一失败则该 PR 的状态检查变红，配合分支规则集（protect-master）阻止合并。
# 三个 job 的 status check context 分别为：build-backend / build-frontend / build-worker
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build backend
        working-directory: backend
        run: npm run build

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Build worker (includes frontend + shared sync)
        working-directory: worker
        run: npm run build
